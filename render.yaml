# Free preview only: Render's free PostgreSQL database expires after 30 days.
services:
  - type: web
    name: factory-erp-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh render-start.sh
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: DATABASE_URL
        fromDatabase:
          name: factory-erp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_STAFF_ID
        value: ADM001
      - key: INITIAL_ADMIN_EMAIL
        value: preview-admin@factory.invalid
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: factory-erp-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: factory
    user: factory
    ipAllowList: []
